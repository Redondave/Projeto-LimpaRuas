name: Coleta Diaria de Trafego - Gama

on:
  schedule:
    # Executa a cada 15 minutos entre 18:00 e 19:00 de Segunda a Sexta (1-5)
    - cron: '*/15 21-22 * * 1-5'
  workflow_dispatch:

jobs:
  collect-traffic-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install geopandas requests pandas

      - name: Executar Script de Coleta
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python scripts/api_caller.py

      - name: Salvar e Commitar Historico Atualizado (Append)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/tomtom_flow_history.jsonl cache/gama_drive_sample_30_tomtom.gpkg
          git commit -m "chore: atualizacao automatica de trafego Gama [$(date -u +'%Y-%m-%d %H:%M UTC')]" || exit 0
          git pull --rebase origin main
          git push