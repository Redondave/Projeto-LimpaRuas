name: Coleta Diaria de Trafego - Gama

on:
  schedule:
    # O GitHub atrasa o cron (ja houve 3 h de atraso). Disparamos a cada 5 min de
    # 17:00 a 18:55 de Brasilia (20:00-21:55 UTC); o script decide se a rodada vale
    # (dia util, 18:00-19:00, limite diario, 5 dias uteis) e sai sem gastar cota
    # quando nao vale.
    - cron: '*/5 20-21 * * 1-5'
  workflow_dispatch:

# uma rodada por vez: duas simultaneas veriam o mesmo historico e estourariam o limite diario
concurrency:
  group: coleta-tomtom
  cancel-in-progress: false

jobs:
  collect-traffic-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar janela de coleta
        id: janela
        run: python scripts/api_caller.py --verificar

      - name: Instalar Dependencias
        if: steps.janela.outputs.coletar == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install geopandas requests pandas numpy shapely

      - name: Executar Script de Coleta
        if: steps.janela.outputs.coletar == 'true'
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python scripts/api_caller.py

      - name: Salvar e Commitar Historico Atualizado (Append)
        if: steps.janela.outputs.coletar == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/tomtom_flow_history.jsonl
          git commit -m "chore: atualizacao automatica de trafego Gama [$(date -u +'%Y-%m-%d %H:%M UTC')]" || exit 0
          git pull --rebase origin main
          git push
